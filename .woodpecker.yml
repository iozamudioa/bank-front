steps:
  - name: publish-bank-front
    image: docker:cli
    environment:
      NEXUS_USERNAME:
        from_secret: nexus_username
      NEXUS_PASSWORD:
        from_secret: nexus_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "$NEXUS_PASSWORD" | docker login registry.ioza.dev -u "$NEXUS_USERNAME" --password-stdin
      - docker build -t registry.ioza.dev/bank/bank-front:0.1.0-SNAPSHOT .
      - docker push registry.ioza.dev/bank/bank-front:0.1.0-SNAPSHOT

  - name: deploy-bank-front
    image: docker:cli
    environment:
      NEXUS_USERNAME:
        from_secret: nexus_username
      NEXUS_PASSWORD:
        from_secret: nexus_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/iozamudioa/docker/bank-front:/home/iozamudioa/docker/bank-front
    commands:
      - echo "$NEXUS_PASSWORD" | docker login registry.ioza.dev -u "$NEXUS_USERNAME" --password-stdin
      - cp compose.yaml /home/iozamudioa/docker/bank-front/compose.yml
      - cd /home/iozamudioa/docker/bank-front
      - docker compose -f compose.yml -p bank-front config --quiet
      - docker compose -f compose.yml -p bank-front pull bank-front bank-front-emissary
      - docker compose -f compose.yml -p bank-front up -d --force-recreate bank-front bank-front-emissary
      - docker compose -f compose.yml -p bank-front logs --tail=30 bank-front bank-front-emissary

when:
  - event: [push, manual]
    branch: main
