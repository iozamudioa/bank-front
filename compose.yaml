services:
  bank-front:
    image: registry.ioza.dev/bank/bank-front:0.1.0-SNAPSHOT
    container_name: bank-front
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
    expose:
      - "80"
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  infra-net:
    external: true
