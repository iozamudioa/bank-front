services:
  bank-front:
    image: registry.ioza.dev/bank/bank-front:0.1.0-SNAPSHOT
    container_name: bank-front
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
    expose:
      - "80"
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bank-front-emissary:
    image: curlimages/curl:8.16.0
    container_name: bank-front-emissary
    restart: unless-stopped
    depends_on:
      bank-front:
        condition: service_healthy
    environment:
      BASTION_URL: http://bastion:8080
      BASTION_USERNAME: tavern
      BASTION_PASSWORD: ${BASTION_PASSWORD:?Set BASTION_PASSWORD in the deployment .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        instance_id="bank-$$(cat /proc/sys/kernel/random/uuid)"
        started_at="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "Registering bank instance $$instance_id"
        while true; do
          registration="$$(printf '{"tavernId":"bank","instanceId":"%s","target":"http://bank-front:80","healthPath":"/health","version":"0.1.0-SNAPSHOT","startedAt":"%s"}' "$$instance_id" "$$started_at")"
          if curl --fail --silent --show-error --max-time 10 --retry 2 --retry-delay 2 --basic --user "$$BASTION_USERNAME:$$BASTION_PASSWORD" --header 'Content-Type: application/json' --data "$$registration" "$$BASTION_URL/internal/kingdom/taverns"; then
            echo "Bank Front instance $$instance_id registered in Bastion"
          else
            echo "Bank Front registration failed; retrying in 30s" >&2
          fi
          sleep 30
        done
    networks:
      - infra-net

networks:
  infra-net:
    external: true
