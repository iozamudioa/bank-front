services:
  bank-front:
    image: registry.ioza.dev/bank/bank-front:0.1.0-SNAPSHOT
    container_name: bank-front
    environment:
      TZ: America/Mexico_City
      KINGDOM_TAVERN_HOST_MODE: STATIC
      KINGDOM_TAVERN_API_PROXY_URL: http://bastion:8080
      KINGDOM_TAVERN_NAME: bank-front
      KINGDOM_TAVERN_DOMAIN: bank.ioza.dev
      KINGDOM_TAVERN_PATH: /**
      KINGDOM_BASTION_URL: http://bastion:8080
      KINGDOM_BASTION_USERNAME: ${KINGDOM_BASTION_USERNAME}
      KINGDOM_BASTION_PASSWORD: ${KINGDOM_BASTION_PASSWORD}
      KINGDOM_TAVERN_LOCK_ENABLED: "false"
    restart: unless-stopped
    networks:
      - infra-net

networks:
  infra-net:
    external: true
