server {
    listen 80;
    server_name bank.ioza.dev;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
