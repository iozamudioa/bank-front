<h3>¿De qué otros sobres deseas tomar la diferencia?</h3>
<p class="muted">
  Puedes combinar varios sobres de la misma cuenta. Indica cuánto aporta cada uno.
</p>
@for (d of donors(); track d.envelopeId) {
  <label class="donor"
    ><span
      >{{ d.name
      }}<small>Disponible: {{ d.balance | currency: 'MXN' : 'symbol-narrow' }}</small></span
    ><input
      type="text"
      inputmode="decimal"
      [attr.aria-label]="'Aportación de ' + d.name"
      [value]="amounts().get(d.envelopeId) || ''"
      [disabled]="disabled()"
      (input)="changed.emit({ id: d.envelopeId, value: $any($event.target).value })"
      placeholder="0.00"
  /></label>
} @empty {
  <p class="error">No hay otros sobres elegibles con saldo en esta cuenta.</p>
}
