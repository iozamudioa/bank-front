<section class="panel">
  <div class="eyebrow">PREPARA TU HOGAR</div>
  <h2>Tu guía para comenzar</h2>
  <div class="steps">
    @for (item of steps; track item.name; let i = $index) {
      <button [class.selected]="step() === i" (click)="step.set(i)">
        {{ i + 1 }}. {{ item.name }}
      </button>
    }
  </div>
  <h3>{{ steps[step()].name }}</h3>
  <p class="muted">{{ steps[step()].description }}</p>
  <a class="primary" [routerLink]="steps[step()].path"
    >Ir a {{ steps[step()].name.toLowerCase() }} <app-icon name="arrow_forward" size="sm"
  /></a>
  <div class="actions">
    <button [disabled]="step() === 0" (click)="previous()">Anterior</button
    ><button [disabled]="step() === steps.length - 1" (click)="next()">Siguiente</button>
  </div>
  <small
    >Los datos guardados se recuperan desde la API. No se registran operaciones
    automáticamente.</small
  >
</section>
