<aside class="toast-outlet" aria-label="Notificaciones">
  @for (toast of toasts.messages(); track toast.id) {
    <div class="toast">
      <app-icon name="check_circle" />
      <span role="status" aria-atomic="true">{{ toast.message }}</span>
      <button type="button" aria-label="Cerrar notificación" (click)="toasts.dismiss(toast.id)">
        <app-icon name="close" size="sm" />
      </button>
    </div>
  }
</aside>
